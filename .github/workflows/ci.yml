name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Golden regression (live, requires credentials)
        if: ${{ secrets.NL2CONFIG_API_KEY != '' }}
        env:
          NL2CONFIG_API_KEY: ${{ secrets.NL2CONFIG_API_KEY }}
          NL2CONFIG_BASE_URL: ${{ secrets.NL2CONFIG_BASE_URL }}
        run: python3 -m nl2config.cli regress
